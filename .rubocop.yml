AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes
Layout/LineLength:
  Max: 120
  Exclude:
    - "spec/**/*"
Metrics:
  Enabled: false
Style/Documentation:
  Exclude:
    - "spec/**/*"
Naming/PredicateMethod:
  Enabled: false
Naming/MethodParameterName:
  AllowedNames: [q, id]
